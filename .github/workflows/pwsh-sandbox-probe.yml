# Does PowerShell start under the workspace-write restricted token when no
# injecting AV is present?
#
# anywhere-labs/deepseek-harness-desktop#203 asked reporters to separate the
# restricted token / pwsh startup chain from the extra triggering that 火绒,
# 360 and enterprise EDR add by injecting DLLs. A windows-latest runner carries
# Defender and nothing that injects, so it answers the first branch on its own.
#
# Manual only. It exists to produce one report, not to run on every push.
name: pwsh sandbox probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Which process creates the restricted token. `node` is the CLI shape.
        # `electron` is the packaged desktop shape, where the runner is an
        # ELECTRON_RUN_AS_NODE child. That is the only structural difference
        # between the two, so it is the cell #203 needs.
        # electron-spawn-node is the repair #203 proposed, an Electron parent
        # that hands the runner to a separate Node runtime instead of loading
        # it in process. It turns this matrix from a diagnosis into a check on
        # whether the proposed fix actually holds.
        chain: ['node', 'electron', 'electron-spawn-node']
    name: chain ${{ matrix.chain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Not saved to package.json: electron is only needed to reproduce the
      # desktop launch chain, never to run or build the plugin. Version pinned
      # to what the desktop app ships (#203).
      - name: install electron
        if: startsWith(matrix.chain, 'electron')
        run: npm install --no-save electron@43.4.0
      - run: npm run build
      # The probe never fails on the workspace-write result: that cell is the
      # finding either way. It exits non-zero only when the unconfined control
      # cannot start the shell, which would mean the host is wrong.
      - name: probe
        timeout-minutes: 10
        env:
          SMOKE_CHAIN: ${{ matrix.chain }}
        run: node scripts/pwsh-sandbox-probe.mjs
