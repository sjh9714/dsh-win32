# Diagnostic branch only: official installer payload, never installed on a user host.
name: pwsh sandbox probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Extract the digest-verified official Desktop 2.0.11 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP ('dsh-win32-upstream-' + [guid]::NewGuid())
          New-Item -ItemType Directory $probeRoot | Out-Null
          $installer = Join-Path $probeRoot 'DSH-Desktop-2.0.11-x64-Setup.exe'
          Invoke-WebRequest 'https://github.com/anywhere-labs/dsh-desktop/releases/download/v2.0.11/DSH-Desktop-2.0.11-x64-Setup.exe' -OutFile $installer
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($digest -ne 'e758d6cb70f33c748f14c9f66f40d93be8fdc661deba6bbfcf02b4d5ccd723f7') { throw 'Installer digest mismatch' }
          $unpacked = Join-Path $probeRoot 'installer'
          & 7z x $installer "-o$unpacked" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $payloads = @(Get-ChildItem -LiteralPath $unpacked -Recurse -Filter 'app-64.7z')
          if ($payloads.Count -ne 1) { throw 'Expected one x64 payload' }
          $payload = Join-Path $probeRoot 'payload'
          & 7z x $payloads[0].FullName "-o$payload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Payload extraction failed' }
          $app = Join-Path $payload 'resources/app'
          $meta = Get-Content -Raw (Join-Path $app 'package.json') | ConvertFrom-Json
          if ($meta.name -ne 'dsh-plugin-desktop' -or $meta.version -ne '2.0.11') { throw 'Unexpected application identity' }
          $cargo = (& rustup which cargo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $cargo -PathType Leaf)) { throw 'Cargo not available' }
          "PROBE_ROOT=$probeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_ELECTRON=$(Join-Path $payload 'DSH Desktop.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_CARGO=$cargo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "official_installer_sha256=$digest"
          Write-Output "desktop=$($meta.version) dsh=$($meta.dependencies.'@deepseek-ai/dsh')"
      - name: Compare Node and consoleless packaged Electron; record Cargo TLS separately
        shell: pwsh
        env:
          CI: 'true'
        run: node scripts/upstream-windows-probe.mjs
      - name: Preserve synthetic evidence, not profiles or package payloads
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-windows-probe-${{ matrix.os }}
          path: ${{ env.PROBE_ROOT }}/results/*.json
          if-no-files-found: warn
