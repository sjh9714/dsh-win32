name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: persistent PTY smoke (the flagship claim, on the real OS)
        timeout-minutes: 5
        run: node scripts/pty-smoke.mjs
      - name: doctor + setup smoke
        shell: bash
        run: |
          node bin/cli.mjs doctor
          if [ "$RUNNER_OS" = "Windows" ]; then
            node bin/cli.mjs setup --no-bundle
            grep -q 'bash.exe' "$USERPROFILE/.dsh/.agent-presets/minimal-windows/agent.cordis.yml"
          else
            node bin/cli.mjs setup --bash /bin/bash --no-bundle
            grep -q "shellPath: '/bin/bash'" "$HOME/.dsh/.agent-presets/minimal-windows/agent.cordis.yml"
          fi

  sandbox-experiment:
    # First-ever exercise of the win32 sandboxed persistent-shell path
    # (core CI excludes terminal-bash and sandbox-local on win32).
    # Experimental until proven: does not gate the main matrix.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: sandboxed PTY (danger-full-access control)
        timeout-minutes: 6
        run: node scripts/sandbox-smoke.mjs
        env:
          SANDBOX_MODE: danger-full-access
      - name: workspace-write regression watch (known MSYS failure signature)
        timeout-minutes: 6
        shell: bash
        env:
          SANDBOX_MODE: workspace-write
        run: |
          set +e
          out=$(node scripts/sandbox-smoke.mjs 2>&1)
          code=$?
          echo "$out" | tail -5
          if [ $code -eq 0 ]; then
            echo "NEWS: workspace-write persistent shell now WORKS on win32 (was known-broken)"
            exit 0
          elif echo "$out" | grep -q "TokenDefaultDacl"; then
            echo "reproduced the documented MSYS restricted-token failure (expected)"
            exit 0
          else
            echo "NEW failure mode (signature changed) — investigate"
            exit 1
          fi

  busybox-experiment:
    # v0.4 gate: can a non-Cygwin shell (busybox-w32 ash) survive the
    # WRITE_RESTRICTED token where MSYS bash dies at cygheap init?
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: fetch busybox-w32
        shell: bash
        run: curl -fL -o busybox64.exe https://frippery.org/files/busybox/busybox64.exe && ./busybox64.exe sh -c 'echo busybox alive'
      - name: busybox ash under danger-full-access (control)
        timeout-minutes: 6
        shell: bash
        run: SMOKE_BASH="$PWD/busybox64.exe" SMOKE_SHELL_ARGS="sh,-i" SANDBOX_MODE=danger-full-access node scripts/sandbox-smoke.mjs
      - name: busybox ash under workspace-write (the gate)
        timeout-minutes: 6
        shell: bash
        run: SMOKE_BASH="$PWD/busybox64.exe" SMOKE_SHELL_ARGS="sh,-i" SANDBOX_MODE=workspace-write node scripts/sandbox-smoke.mjs
